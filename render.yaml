services:
  - type: web
    name: backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TRINO_SERVER
        sync: false
      - key: TRINO_CATALOG
        value: iceberg
      - key: TRINO_SCHEMA
        value: analytics
      - key: TRINO_USER
        value: admin
